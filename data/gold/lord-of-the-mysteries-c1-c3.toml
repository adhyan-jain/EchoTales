# annotation as the positives: without them, precision at the
# entity-existence level cannot be measured at all -- only coreference among
# things already assumed to be entities.
# ---------------------------------------------------------------------------

[[not_entity]]
reason = "A legendary figure from a Chinese proverb, appearing ONLY in the translator's footnote appended to chapter 1, outside the narrative entirely. A capitalised personal name inside a non-diegetic block is precisely what the NON_DIEGETIC/AUTHOR_NOTE span types exist to exclude, so a mention here is a segmentation failure rather than a cast member -- which makes it the most useful single negative in this file."
surfaces = ["Lord Ye"]

[[not_entity]]
