# Annotation source for Lord of the Mysteries, chapters 1-3.
#
# PROVENANCE: drafted by a language model (Claude Opus 5) reading the chapter
# text directly, NOT by a person, and NOT by inspecting the pipeline's output.
# Every record it expands to carries provenance = "model" and confirmed =
# false. It is a second opinion and a draft for review. It is not gold, and no
# number computed from it may be reported as a recall or accuracy result until
# a person has reviewed it and flipped `confirmed`.
#
# WHY THIS FILE EXISTS. `data/gold/lord-of-the-mysteries.jsonl` is **100%
# circular** -- all 6,756 records were built by `eval/generate_gold.py`
# SELECTing the pipeline's own resolved `mention` table, so scoring against it
# compares the system to itself (EVOLUTION 4.74). This file is the start of
# the independent replacement (COMPLETION_PLAN Track 2 item 5). It covers
# chapters 1-3 of 40. **It does not replace that file yet** -- three chapters
# is a start, not a volume.
#
# INDEPENDENCE. The drafter read the chapter text for these three chapters and
# wrote every identity below from it, without querying the pipeline's entity
# list for this novel at any point. That is a stronger claim than the RI
# c1-c5 draft could make (its own header records an anchoring risk). The
# corpus-level facts quoted elsewhere in the drafting session -- mention
# counts, method splits -- concern reverend-insanity, not this novel.
#
# FORMAT: one block per real-world referent, with every surface form the text
# uses for it. `surfaces` are matched case-sensitively on word boundaries and
# expanded to one gold record per occurrence.
#
# SCOPE NOTE, and it is load-bearing: within these three chapters each surface
# listed below denotes exactly one referent, verified by reading.
# `eval/draft.py::_assert_unambiguous` (EVOLUTION 4.79) now enforces that no
# surface is claimed twice in this file, but it cannot check the thing that
# actually matters -- that a surface has one referent *in the text*. That
# remains a reading claim.
#
# TWO DELIBERATE OMISSIONS, recorded so a reviewer can disagree with them
# rather than discover them:
#
#  1. Bare "Tingen" is NOT listed as a location, although the text uses
#     "Tingen City" and "City of Tingen". Word-boundary matching would make
#     bare "Tingen" also match inside "Tingen University" and "Tingen
#     Technical School", labelling the first token of an organization as a
#     location. Only the full forms are annotated.
#  2. "Klein Moretti" is NOT listed as a surface, only bare "Klein". A
#     word-boundary PREFIX collides: both match at the same start offset, and
#     `GoldMention.key` is (novel, chapter, offset), so one record would
#     silently overwrite the other. Bare "Klein" covers all 23 positions
#     including the 3 full-name ones. Same reason "Sunday school" is dropped
#     in favour of "Sunday". `_prefix_collisions` now refuses this
#     mechanically -- it was added *because* drafting this file produced five
#     such collisions in a file that otherwise expanded without a warning.
#  3. Bare "Moretti" is NOT listed. Klein, Benson and Melissa share it, so it
#     is a family name, not a person -- the same reason RI's gold refuses a
#     bare surname, and the behaviour `name_containment` is documented to
#     have.

schema = 1
novel_id = "lord-of-the-mysteries"
chapters = [1.0, 2.0, 3.0]
drafted_by = "claude-opus-5"

# ---------------------------------------------------------------------------
# Characters
# ---------------------------------------------------------------------------

[[identity]]
name = "Klein Moretti"
kind = "character"
surfaces = ["Zhou Mingrui", "Klein"]
note = """Protagonist, and THE HARD CASE in this slice -- the reason these three chapters are worth annotating at all. Zhou Mingrui is a modern Chinese man whose consciousness wakes in the body of Klein Moretti, a Loen history graduate who has just died of a gunshot to the temple; Klein's memories then surface and merge. The narration uses "Zhou Mingrui" for the acting viewpoint character throughout, "Klein" for the body's biography and memories, and Melissa addresses him aloud as "Klein" in ch3.

Annotated as ONE referent, which a reviewer may reasonably overturn. For one: from ch1 onward every mention of either name picks out the single person standing in that room, and a partition that split them would fail on "Melissa gave her elder brother a piercing stare" -- Melissa's brother is Klein, the person being stared at is Zhou Mingrui. For two: passages such as the father's army service and "how Klein had died" describe the original Klein, before the merge.

In this project's own vocabulary the split is Self vs Persona, not two Selves: one continuity of consciousness bound to one body. This file annotates coreference over mentions, which has no way to express that, so it says "one referent" and records the disagreement here rather than hiding it."""

