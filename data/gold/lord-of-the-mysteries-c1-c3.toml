name = "Benson"
kind = "character"
surfaces = ["Benson"]
note = "Elder brother. A clerk at an import and export company and the family's sole earner. The surname is never used bare for him in these chapters."

[[identity]]
name = "Melissa"
kind = "character"
surfaces = ["Melissa"]
note = "Younger sister, fifteen, a student in Tingen Technical School's Steam and Machinery department. The only character besides the protagonist with on-page dialogue in ch1-3."

[[identity]]
name = "Mr. Franky"
kind = "character"
surfaces = ["Mr. Franky"]
note = "The landlord, ch2. Appears only in recalled scenes and never on-page in this range -- a real individual and a real mention, but not physically present, which is exactly the distinction `reference_mode` exists to draw. Only the honorific form is listed: bare \"Franky\" never occurs without \"Mr.\" here, and listing it would double-label the same span."

[[identity]]
