name = "Fang Yuan"
kind = "character"
surfaces = ["Fang Yuan", "Gu Yue Fang Yuan"]
note = "Protagonist. Extended from c1-c5: unambiguous proper name throughout."

[[identity]]
name = "Fang Zheng"
