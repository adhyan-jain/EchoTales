# ---------------------------------------------------------------------------
# New character, dense-verified in chapter 9
# ---------------------------------------------------------------------------

[[identity]]
name = "Gu Yue Dong Tu"
kind = "character"
surfaces = ["Gu Yue Dong Tu"]
note = "Fang Yuan and Fang Zheng's uncle/guardian, ch9 (the primeval-stone-giving scene). Before the emphasis-split-length fix (spans/classify.py), the source's mid-name italicisation of 'Gu' tore this surface into two spans and it needed a manual merge+reassign every time -- this record is what makes that fix's effect measurable rather than an impression. Only the full name is annotated; 'Uncle' alone recurs ~15x in ch9 referring to him but is left unannotated, same convention as c1-c5's bare 'the elder'."

