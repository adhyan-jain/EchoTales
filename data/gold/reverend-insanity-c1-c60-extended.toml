surfaces = ["South Border", "Southern Border"]
note = "Extended from c1-c5, with 'Southern Border' added as the same place -- the pipeline's ch1-60 rerun split these into two entities (self11/self30), which an automated review pass (Haiku) correctly flagged as a duplicate and merged. This record is what makes that specific call measurable."

# ---------------------------------------------------------------------------
# Non-entities: the false-positive pattern this session's pipeline work
# fixed (resolve/runner.py auto-flagging) and found (Haiku review of the
# ch1-60 rerun). Structural, not chapter-scoped -- see header note.
# ---------------------------------------------------------------------------

[[not_entity]]
surfaces = ["Gu"]
reason = "The novel's central term (magical worm/insect), used constantly as a bare capitalised word. Was becoming a standalone gazetteer entity and tearing names apart mid-span (see 'Uncle Gu Yue Dong Tu' above) before mentions/gazetteer.py's AMBIGUITY_BLOCKLIST fix this session. The single highest-value regression-guard entry in this file."

[[not_entity]]
surfaces = ["Single Gate Poison Gu", "Bear Strength Gu", "Stream Gu", "Moonlight Gu", "Liquor Gu", "Relic Gu"]
reason = "Named Gu constructs/items Fang Yuan refines or uses -- proper-noun-shaped item names, not characters. Each became a spurious `self` entity in the ch1-60 rerun; caught by an automated Haiku review pass and independently by resolve/runner.py's new NER-label auto-flag."

[[not_entity]]
surfaces = ["Mo Family"]
reason = "A family/organization reference, not an individual -- misparsed as a character in the ch1-60 rerun."
