<text x="273.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Spans</text>
<text x="273.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">dialogue / narration /</text>
<text x="273.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">thought / system</text>
<line x1="170" y1="119.0" x2="198" y2="119.0" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="376" y="80" width="150" height="78" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
<text x="451.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Mentions</text>
<text x="451.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">gazetteer + chapter NER,</text>
<text x="451.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">typed aliases</text>
<line x1="348" y1="119.0" x2="376" y2="119.0" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="554" y="80" width="150" height="78" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
<text x="629.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Resolve</text>
<text x="629.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">incremental evidence,</text>
<text x="629.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">hard pre-filter gates</text>
<line x1="526" y1="119.0" x2="554" y2="119.0" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="732" y="80" width="150" height="78" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
