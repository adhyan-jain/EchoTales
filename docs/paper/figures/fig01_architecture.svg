<text x="807.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">bodies, appearance,</text>
<text x="807.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">canon</text>
<line x1="704" y1="119.0" x2="732" y2="119.0" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="210" width="862" height="70" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
<text x="451.0" y="228.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Narrative graph (SQLite)</text>
<text x="451.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">Self / Persona / aliases / attributes / relations / observations,</text>
<text x="451.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">each fact with a story-time interval, a knowledge position and an observer</text>
<line x1="95.0" y1="158" x2="95.0" y2="210" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="273.0" y1="158" x2="273.0" y2="210" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="451.0" y1="158" x2="451.0" y2="210" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="629.0" y1="158" x2="629.0" y2="210" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="807.0" y1="158" x2="807.0" y2="210" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="20" y="330" width="250" height="64" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
<text x="145.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Panels -&gt; chapter video</text>
<text x="145.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">render plan per beat, image engine,</text>
<text x="145.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">composited 1080x1920</text>
<rect x="300" y="330" width="250" height="64" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
<text x="425.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Audio</text>
<text x="425.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">voice casting per character,</text>
<text x="425.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">TTS per line</text>
<rect x="580" y="330" width="250" height="64" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
<text x="705.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Review desk (webview)</text>
<text x="705.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">corrections logged, then</text>
<text x="705.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">applied to the graph</text>
<line x1="145" y1="280" x2="145" y2="330" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="149.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#6b7280" font-weight="normal">state at the panel&#x27;s position</text>
<line x1="425" y1="280" x2="425" y2="330" stroke="#1f2933" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="429.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#6b7280" font-weight="normal">cast + speakers</text>
