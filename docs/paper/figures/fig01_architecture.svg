<text x="709.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#6b7280" font-weight="normal">apply</text>
<text x="20.0" y="426.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">Stages run volume-first; every stage writes to the graph, and both output modalities read from it.</text>
</svg>
