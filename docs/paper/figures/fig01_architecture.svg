<text x="95.0" y="98.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Ingest</text>
<text x="95.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">EPUB -&gt; chapters,</text>
<text x="95.0" y="130.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">blocks</text>
