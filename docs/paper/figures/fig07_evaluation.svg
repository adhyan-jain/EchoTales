<text x="120.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">none / bulk / per_record</text>
<rect x="250" y="60" width="220" height="174" rx="6" fill="#ecfdf5" stroke="#9ca3af"/>
<text x="360.0" y="78.0" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2933" font-weight="bold">Validation before scoring</text>
<text x="360.0" y="96.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">alias type coverage</text>
<text x="360.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">colliding keys</text>
