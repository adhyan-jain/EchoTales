<text x="585.0" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">B3, MUC, CEAF-e,</text>
<text x="585.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal">recall@K, ablations</text>
