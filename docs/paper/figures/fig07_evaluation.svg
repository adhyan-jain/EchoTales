<text x="20.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1f2933" font-weight="normal">Every number is scored against an LLM-drafted SILVER set (provenance &#x27;model&#x27;); no record is human gold and no agreement figure exists.</text>
<text x="20.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal">A figure cites the result file it came from; a model-drafted record can never be reported as gold.</text>
</svg>
