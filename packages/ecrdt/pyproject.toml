[project]
name = "ecrdt"
version = "0.1.0"
description = "Research prototype: Epistemic CRDT (E-CRDT) - world convergence with provable epistemic non-interference. Standalone; imports nothing from echotales-core or echotales-pipeline."
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecrdt"]
