[project]
name = "echotales-pipeline"
version = "0.1.0"
description = "EchoTales pipeline: ingest, resolve, eval."
requires-python = ">=3.12,<3.15"
dependencies = [
    "echotales-core",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "regex>=2024.5",
    "pyahocorasick>=2.1",
    "httpx>=0.27",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    # voice/qa.py median_f0 (pyin) and the Whisper resampler; imported at call time by the audition path and its tests.
    "librosa>=0.10",
    "pillow>=10.1",
]

[project.optional-dependencies]
ml = [
    "gliner>=0.2.13",
    "spacy>=3.7",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
]
api = [
    "anthropic>=0.40",
]
render = [
    "torch>=2.2",
    "diffusers>=0.30",
    "compel>=2.5",
    # Z-Image Turbo worker: GGUF weights, 4-bit text encoder (workers_zimage.py)
    "gguf>=0.17",
    "bitsandbytes>=0.45",
]

comic = [
    # Comic -> motion comic (`echotales comic`): page decoding, text recognition, clean plates, depth parallax warp.
    # LaMa and Depth Anything need only torch/transformers from the `render` extra plus weights under data/models/.
    "opencv-python-headless>=4.9",
    "pypdfium2>=4.30",
    "rapidocr-onnxruntime>=1.3",
    "scipy>=1.11",
]

browser = [
    # Optional: `echotales comic fetch --render` loads a chapter page in a headless browser and scrolls it. This extra
    # installs no browser; run `playwright install chromium` once.
    "playwright>=1.45",
]

[tool.uv.sources]
echotales-core = { workspace = true }

[project.scripts]
echotales = "echotales.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echotales"]
