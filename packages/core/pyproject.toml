[project]
name = "echotales-core"
version = "0.1.0"
description = "EchoTales core: models, store, state_of(). Imports nothing from the pipeline."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echotales"]
