kill_criterion = "Q1 KILL if specific-minus-narrator manifestation under error has a paired bootstrap 95% CI including 0 in every error type. DEFINITIONAL (the causal effect is real but is the cast table restated, not a phenomenon) if realised-audio margins are predicted from reference-clip geometry with R^2 >= 0.9 and the same action ordering in every error type. PHENOMENON only if Q1 holds AND a systematic residual exists (R^2 < 0.9 or an ordering reversal or generic-voice gender leakage on cross-gender errors that the geometry does not predict). Manipulation check precondition: correct-specific renders identified as the intended bank voice >= 90% by voice_geometry.identify, else the run is INVALID."
