[H-IOL]
title = "An ideal-observer listener that learns the voice->character map predicts non-uniform, spillover error costs"
theme = "T1 perceptual cost of upstream errors (mechanism layer); convergence theme beta (learned-mapping leverage)"
statement = "A Bayesian listener that learns which voice belongs to which character from textually tagged lines predicts, on PDNC passages with injected errors: (P1) spillover -- errors lower comprehension of *correctly rendered* implicit lines; (P2) tag poisoning -- an error on a tagged line has a lower direct cost but a higher spillover cost than one on an implicit line; (P3) the error rate at which full cast stops beating a single narrator (a*) differs between diverse and homogeneous casts; (P4) late casting (narrator until a character's 2nd tagged line) reduces spillover."
kill_criterion = "Under the median listener parameters, spillover per error < 0.25 x direct cost per error (the model collapses to a per-line uniform-cost model); OR the sign of P1, P2 or P3 flips anywhere in the 24-setting listener-parameter grid (the prediction is an artefact of parameter choice). P4 is reported, not a kill condition."
status = "SURVIVING"
experiments = ["ideal_listener"]
evidence = ["data/eval/research/H-IOL/real-d531b1c1f6b0b632/results.json"]
firewall = "Attribution is a manipulated input; the model is of a listener's voice-to-label learning, not of narrative identity."
mutation_of = ["C01", "C02", "C11", "C17", "C03"]
prior_art = ["Kleinschmidt & Jaeger 2015 (ideal adapter, phonetic talker adaptation)", "Fenn et al. 2025 PMC12181647 (voice-identity learning)", "Lavan et al. 2019 Nat Commun (average-based voice identity)", "SpeakerSleuth arXiv 2601.04029"]
level = 2
depth = ["L1", "L2", "L3", "L4"]

note = "Model level only: P1 and P2 hold in 24/24 listener settings; P3 (crossover) not supported -- an ideal listener does not fall below the narrator within 60% errors in 22/24 settings. Becomes a result about people only through H-COST v2."
[H-CCAST]
title = "Confusion-aware casting beats globally reduced distinctiveness"
theme = "T1 perceptual cost of upstream errors (method); mutation of the killed hedge"
statement = "Assigning voices with knowledge of *which* character pairs the upstream attributor confuses (predicted from structural pair features fitted on other novels) gives a better held-out frontier of correct-line identifiability vs salient-error mass than the same trade-off with confusion-blind (uniform) pair weights."
kill_criterion = "On held-out PDNC novels, the paired bootstrap (over novels) of the area between the confusion-aware and uniform-weight frontiers has a CI that includes 0. Predicted risk recorded in advance: confused pairs are interlocutors, the same pairs identifiability needs apart."
status = "KILLED"
experiments = ["confusion_casting"]
evidence = ["data/eval/research/H-CCAST/real-92d76d7efdf5c4d2/results.json"]
firewall = "Voice assignment under a measured error structure; no narrative modelling."
mutation_of = ["C13", "C02", "C04"]
prior_art = ["S-VoCAL arXiv 2603.00958", "Deep Dubbing arXiv 2509.15845", "no confusion-aware casting found (searches 2026-10-02)"]
level = 1
depth = ["L1", "L3", "L6"]

[H-VRUNG]
title = "An SDXL-family engine can render visual commitment rungs that withhold an attribute"
theme = "T1 visual arm (precondition for H-VABST)"
statement = "At fixed seeds, rungs {back view, silhouette, setting-only, distant crop} hide a character's gender and hair colour from automatic attribute probes while the committed rung shows them."
kill_criterion = "Any withholding rung leaks the attribute (probe recovery of the intended value > 70% where chance is 50%) on both gender and hair; OR the committed rung fails to commit (recovery < 80%)."
status = "SURVIVING"
experiments = ["visual_rungs"]
evidence = ["data/eval/research/H-VRUNG/real-bd79f777dc64f3a9/results.json", "data/eval/research/H-VRUNG/real-a89a29764cb7eea2/results.json"]
firewall = "Generic attribute specificity of a rendered figure; the uncertainty source is abstract."
mutation_of = ["C22", "C14", "C13"]
prior_art = ["IMPLICIT-Bench arXiv 2609.24228", "default images arXiv 2505.09166", "constrained neutrality of SDXL under gender-underspecified prompts (Wiley Expert Systems 2025, 10.1111/exsy.70232)"]
level = 2
depth = ["L1", "L3", "L6"]

note = "Run 1 (bd79...) used an invalid llava probe (unknown on 85% of committed panels) and read KILL; run 2 (a89a..., probe_version 2, probes validated 15/16 on committed panels) passes weakly: committed 0.93/0.88; back_view leaks both; silhouette and crop leak gender (~0.87) but hide hair (~0.65); distant hides gender (0.575) mostly by barely drawing a person. No rung hides both attributes. Attribute-free prompts mostly draw no person; when they do, CLIP reads male."
[H-JUDGE-V]
title = "Upstream errors are lost at different pipeline stages, and judges see only some of the survivors"
theme = "T5 evaluation validity; T3 revival test (convergence theme gamma)"
statement = "Injecting exactly one attribute error upstream of the real prompt assembly at fixed seeds, the end-to-end visibility of the error decomposes into P(clause survives the CLIP budget) x P(generator renders it) x P(judge detects it); conditional on survival and rendering, automatic judges still miss a material share."
kill_criterion = "Conditional on the error clause surviving fit_to_budget AND the generator rendering it (attribute probe), every judge reaches detection AUROC > 0.9 (no validity gap); OR P(generator renders | survives) > 0.9 for every error type (all loss is truncation, which re-kills T3)."
status = "SURVIVING"
experiments = ["judge_intervention"]
evidence = ["data/eval/research/H-JUDGE-V/real-7d9f5d39a811c34b/results.json"]
firewall = "Error transmission through rendering stages; no narrative modelling."
mutation_of = ["C05", "C25", "C27", "C26", "C29"]
prior_art = ["FineGRAIN arXiv 2512.02161", "Fooling the LVLM judges arXiv 2505.15249", "CheckList-style metric perturbation EMNLP 2021", "Urman et al. arXiv 2609.11532"]
level = 2
depth = ["L1", "L3", "L4"]

note = "P(rendered|survives): gender 0.80, hair 0.80, setting 0.125 (setting survives the budget 80% but the generator drops it). CLIPScore detection on 29 pairs with a compliant base and a verified rendered error: AUROC 0.52 [0.35, 0.69] -- chance. llava-7b holistic judge invalid (answers 1 on any 1-10 prompt; no to every yes/no description), reported as an instrument failure, not a judge result. n is small (20 beats, one engine and style)."
[H-LEVER]
title = "Correction budget is best spent by downstream listener leverage, not upstream uncertainty"
theme = "T3 correction allocation (convergence theme beta)"
statement = "With a fixed human-correction budget and an imperfect error score, choosing lines by expected listener-model leverage (P(error) x mapping influence) raises listener comprehension more than lowest-confidence-first, evaluated under a *mismatched* listener model so the policy is not scored by its own objective."
kill_criterion = "Under the mismatched evaluation listener, the paired bootstrap (over windows) of comprehension gain (leverage minus lowest-confidence) has a CI including 0 at the 10% budget; OR leverage's selected set overlaps first-appearance's by > 80% (then it is the first-appearance heuristic: product-only)."
