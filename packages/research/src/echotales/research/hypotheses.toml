[H-GATE-XDIS]
title = "Ladder-vs-LLM disagreement gives a better selective-intervention frontier than ladder confidence"
theme = "Product posterior -> research-enabling signal test (follow-up to H-XDIS); registered 2026-10-03 before analysis code"
statement = "On the 1,000 saved H-XDIS quotes, reviewing quotes ranked by disagreement (P2) or disagreement-then-confidence (P3) catches materially more ladder errors per review than ranking by ladder confidence (P1), at low intervention rates, and the gain is not reproduced by a random pick from the same gold-derived candidate shortlist."
kill_criterion = "PRIMARY: errors-caught gain (P2 or P3 minus P1) < 0.15 at 10% OR at 20% intervention, or its novel-cluster bootstrap 95% CI includes 0. LEAKAGE: the shortlist-random control reaches >= 80% of P2's gain over P1 at both 10% and 20% (artifact). STATUS MAP: GREENLIGHT = primary + best XDIS policy catches >= 40% of errors at 10% + control passes + advantage in >= 2 error categories with >= 20 errors; PRODUCT-INFRA = primary passes but control or stratification fails; CONDITIONAL = primary passes at one rate only; KILL = primary fails."
status = "SURVIVING"
experiments = ["gate_xdis"]
# Order matters: aggregate.py summarises the LAST entry, and the canonical
