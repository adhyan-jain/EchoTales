note = "Pre-registered verdict CONDITIONAL: P3 beats confidence by +0.299 [0.143, 0.462] errors-caught at 20% review but +0.139 [0.074, 0.217] at 10% (bar 0.15). Shortlist-random control is worse than confidence (no artifact). Disclosed robustness run excluding 58 unscorable gold labels: +0.169 at 10%, meets all criteria (post hoc, does not overturn). Main open question: qwen was given a gold-derived shortlist."

